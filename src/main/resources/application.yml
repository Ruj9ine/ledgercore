server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ledgercore
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgercore}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never by Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
